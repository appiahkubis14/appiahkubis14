<svg width="680" height="360" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Samuel Appiah Kubi — logo mark</title>
<desc>Clean satellite globe mark with orbit ring, satellite, signal beam and Africa ping</desc>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
  .tag { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 300; fill: #ea580c; letter-spacing: 7px; }
</style>

<defs>
  <clipPath id="gc"><circle cx="340" cy="168" r="90"/></clipPath>
  <radialGradient id="gbg" cx="38%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#1e293b"/>
    <stop offset="100%" stop-color="#060b14"/>
  </radialGradient>
</defs>

<!-- atmosphere glow -->
<circle cx="340" cy="168" r="100" fill="none" stroke="#ea580c" stroke-width="0.5" opacity="0.12"/>
<circle cx="340" cy="168" r="95"  fill="none" stroke="#ea580c" stroke-width="0.8" opacity="0.2"/>

<!-- globe -->
<circle cx="340" cy="168" r="90" fill="url(#gbg)" stroke="#ea580c" stroke-width="2"/>

<!-- grid -->
<g clip-path="url(#gc)" fill="none" stroke="#ea580c" stroke-width="0.5" opacity="0.22">
  <ellipse cx="340" cy="168" rx="90" ry="22"/>
  <ellipse cx="340" cy="168" rx="90" ry="52"/>
  <ellipse cx="340" cy="168" rx="90" ry="76"/>
  <line x1="250" y1="168" x2="430" y2="168"/>
  <line x1="340" y1="78"  x2="340" y2="258"/>
  <ellipse cx="340" cy="168" rx="40" ry="90" transform="rotate(45  340 168)"/>
  <ellipse cx="340" cy="168" rx="40" ry="90" transform="rotate(90  340 168)"/>
  <ellipse cx="340" cy="168" rx="40" ry="90" transform="rotate(135 340 168)"/>
</g>

<!-- Africa -->
<g clip-path="url(#gc)" fill="#ea580c" opacity="0.45">
  <rect x="328" y="134" width="28" height="54" rx="10"/>
  <rect x="324" y="122" width="18" height="15" rx="4"/>
</g>

<!-- globe specular -->
<ellipse cx="316" cy="132" rx="20" ry="13" fill="#fff" opacity="0.03"/>

<!-- orbit ring -->
<ellipse cx="340" cy="168" rx="140" ry="42"
         fill="none" stroke="#ea580c" stroke-width="1.8"
         transform="rotate(-24 340 168)"/>

<!-- satellite -->
<g transform="translate(436 100) rotate(-24)">
  <rect x="-9" y="-6" width="18" height="12" rx="2.5" fill="#111827" stroke="#ea580c" stroke-width="1.6"/>
  <rect x="-26" y="-4" width="15" height="8" rx="2" fill="#ea580c" opacity="0.95"/>
  <line x1="-11" y1="0" x2="-26" y2="0" stroke="#ea580c" stroke-width="1"/>
  <rect x="11"  y="-4" width="15" height="8" rx="2" fill="#ea580c" opacity="0.95"/>
  <line x1="11" y1="0" x2="26"  y2="0" stroke="#ea580c" stroke-width="1"/>
  <line x1="0"  y1="-6" x2="0"  y2="-15" stroke="#ea580c" stroke-width="1.1"/>
  <circle cx="0" cy="-16" r="2.2" fill="#ea580c"/>
</g>

<!-- signal beam -->
<line x1="428" y1="108" x2="344" y2="166"
      stroke="#ea580c" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.45"/>

<!-- ping on Africa -->
<circle cx="344" cy="166" r="5"  fill="#ea580c"/>
<circle cx="344" cy="166" r="11" fill="none" stroke="#ea580c" stroke-width="1.1" opacity="0.4"/>
<circle cx="344" cy="166" r="18" fill="none" stroke="#ea580c" stroke-width="0.6" opacity="0.18"/>

<!-- corner ticks -->
<g stroke="#ea580c" stroke-width="1.2" opacity="0.4">
  <line x1="228" y1="62"  x2="242" y2="62"/> <line x1="228" y1="62"  x2="228" y2="76"/>
  <line x1="452" y1="62"  x2="438" y2="62"/> <line x1="452" y1="62"  x2="452" y2="76"/>
  <line x1="228" y1="274" x2="242" y2="274"/><line x1="228" y1="274" x2="228" y2="260"/>
  <line x1="452" y1="274" x2="438" y2="274"/><line x1="452" y1="274" x2="452" y2="260"/>
</g>

<!-- tagline -->
<text x="340" y="320" text-anchor="middle" class="tag">GEOSPATIAL INTELLIGENCE</text>

</svg>
